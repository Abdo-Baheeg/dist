# =========================================================
# /etc/nginx/conf.d/llm-master.conf
#
# Architecture:
#
#   Internet
#      │  :80 (or :443 with TLS)
#      ▼
#   NGINX  (rate-limit · health-check · keep-alive)
#      │
#      └──▶ 127.0.0.1:8000  ← single uvicorn master (stateful)
#
# WHY one upstream?
# ─────────────────
# master.py is stateful (in-process worker registry).  Two instances
# would have separate, inconsistent registries.  NGINX still adds
# real value here: TLS termination, rate limiting, request buffering,
# access logging, and /health isolation.
#
# SETUP:
#   sudo cp llm-master.conf /etc/nginx/conf.d/
#   sudo nginx -t
#   sudo systemctl reload nginx
# =========================================================

# ---- rate limiting zone ----
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;     # replace with your domain or EC2 public IP

    # ---- timeouts (must exceed REQUEST_TIMEOUT=120 in master.py) ----
    client_max_body_size  1m;
    proxy_read_timeout    150s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    150s;

    # ---- rate limit: burst of 40, no queue delay ----
    limit_req        zone=api_limit burst=40 nodelay;
    limit_req_status 429;

    # ---- proxy headers ----
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   Connection       "";

    # ---- /health — suppress noisy monitor logs ----
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # ---- all other routes ----
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# =========================================================
# OPTIONAL — HTTPS with certbot / Let's Encrypt
# =========================================================
# server {
#     listen 443 ssl http2;
#     server_name your-domain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
#     # (same limit_req, proxy_pass, and location blocks as above)
# }
